id = "covr.sidebar"
name = "covr"
version = "0.6.3"
min_herdr_version = "0.9.0"
description = "Minimal attention-first Spaces/Agents sidebar: one line per entry, shape glyphs, kind optional"
platforms = ["linux", "macos", "windows"]

# Daemon: started after restore; after a restart or live handoff a surviving daemon re-pushes everything.
[[startup]]
command = ["python3", "bin/covrd.py", "startup"]

# Hooks only wake the daemon (it re-reads herdr state itself); poke.py is a ~15 ms fast path.
[[events]]
on = "pane.agent_status_changed"
command = ["python3", "bin/poke.py"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "bin/poke.py"]

[[events]]
on = "pane.closed"
command = ["python3", "bin/poke.py"]

[[events]]
on = "workspace.created"
command = ["python3", "bin/poke.py"]

[[events]]
on = "worktree.opened"
command = ["python3", "bin/poke.py"]

# renames / focus / order changes: tab labels, the recent sort, done-seen and the manual snapshot update at once
[[events]]
on = "tab.renamed"
command = ["python3", "bin/poke.py"]

[[events]]
on = "workspace.renamed"
command = ["python3", "bin/poke.py"]

[[events]]
on = "workspace.closed"
command = ["python3", "bin/poke.py"]

[[events]]
on = "workspace.focused"
command = ["python3", "bin/poke.py"]

[[events]]
on = "workspace.reordered"
command = ["python3", "bin/poke.py"]

[[events]]
on = "pane.focused"
command = ["python3", "bin/poke.py"]

[[actions]]
id = "cycle-view"
title = "covr: cycle view (triage / needs me / here+)"
contexts = ["global"]
command = ["python3", "bin/covrd.py", "set", "view", "cycle"]

[[actions]]
id = "toggle-group"
title = "covr: cycle grouping (none / project / kind)"
contexts = ["global"]
command = ["python3", "bin/covrd.py", "set", "group_by", "cycle"]

[[actions]]
id = "cycle-kind"
title = "covr: cycle show kind (never / auto / always)"
contexts = ["global"]
command = ["python3", "bin/covrd.py", "set", "show_kind", "cycle"]

[[actions]]
id = "toggle-label"
title = "covr: toggle label (space / task)"
contexts = ["global"]
command = ["python3", "bin/covrd.py", "set", "label", "cycle"]

[[actions]]
id = "cycle-space-sort"
title = "covr: cycle space sort (manual / alpha / recent / activity)"
contexts = ["global"]
command = ["python3", "bin/covrd.py", "set", "space_sort", "cycle"]

[[actions]]
id = "pin-agent"
title = "covr: pin / unpin the focused agent"
contexts = ["pane", "global"]
command = ["python3", "bin/covrd.py", "pin", "agents"]

[[actions]]
id = "pin-space"
title = "covr: pin / unpin the current space"
contexts = ["workspace", "global"]
command = ["python3", "bin/covrd.py", "pin", "spaces"]

[[actions]]
id = "start"
title = "covr: start daemon"
contexts = ["global"]
command = ["python3", "bin/covrd.py", "spawn"]

[[actions]]
id = "stop"
title = "covr: stop daemon and clear tokens"
contexts = ["global"]
command = ["python3", "bin/covrd.py", "stop"]

[[actions]]
id = "settings"
title = "covr: settings"
contexts = ["global"]
command = ["python3", "bin/covrd.py", "settings"]

[[actions]]
id = "install-layout"
title = "covr: install the sidebar layout into herdr's config.toml"
contexts = ["global"]
command = ["python3", "bin/layout.py", "install"]

[[actions]]
id = "uninstall-layout"
title = "covr: remove the sidebar layout from herdr's config.toml"
contexts = ["global"]
command = ["python3", "bin/layout.py", "uninstall"]

[[panes]]
id = "settings"
title = "covr settings"
placement = "popup"
width = 84
height = 26
command = ["python3", "bin/settings.py"]
