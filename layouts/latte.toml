# >>> covr.sidebar layout — managed by the install-layout action; options live in the plugin config, not here
[theme.custom]
surface_dim = "#ccd0da"   # make the spaces/agents divider visible on latte (state colours stay herdr-native)

[ui.sidebar.spaces]
row_gap = 0
rows = [["state_icon", "workspace", { token = "$alert", fg = "#d20f39", bold = true },
         { token = "branch", fg = "#8c8fa1" }, "git_status", { token = "$dirty", fg = "#fe640b" }, { token = "$spin", fg = "#df8e1d" }]]

[ui.sidebar.agents]
row_gap = 0
rows = [
  [{ token = "$icon", fg = "#7c7f93", rules = [
      { starts_with = "\u200b\u200b", fg = "#9ca0b0", dim = true },
      { starts_with = "\u200b", fg = "#8c8fa1" },
      { starts_with = "✻", fg = "#c15f3c" },
      { starts_with = "✦", fg = "#8e75b2" },
      { starts_with = "✧", fg = "#6950ef" } ] },
   { token = "$head", fg = "#4c4f69", rules = [
      { starts_with = "×", fg = "#d20f39", bold = true },
      { starts_with = "✓", fg = "#04a5e5" },
      { starts_with = "◐", fg = "#c27c0e" },
      { starts_with = "○", fg = "#40a02b" },
      { starts_with = "◗", fg = "#9ca0b0", dim = true },
      { starts_with = "·", fg = "#9ca0b0" } ] },
   { token = "$icon_r", fg = "#7c7f93", rules = [
      { starts_with = "\u200b\u200b", fg = "#9ca0b0", dim = true },
      { starts_with = "\u200b", fg = "#8c8fa1" },
      { starts_with = "✻", fg = "#c15f3c" },
      { starts_with = "✦", fg = "#8e75b2" },
      { starts_with = "✧", fg = "#6950ef" } ] },
   ],
  [{ token = "$wait", fg = "#d20f39", bold = true }],
  [{ token = "$done", fg = "#04a5e5" }],
  [{ token = "$task", fg = "#9ca0b0" }],
  [{ token = "$rule", fg = "#bcc0cc" }],
]
# <<< covr.sidebar
