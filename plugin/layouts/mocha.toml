# >>> covr.sidebar (covr) — managed by the install-layout action; options live in the plugin config, not here
[ui.sidebar.spaces]
row_gap = 0
rows = [["state_icon", "workspace", { token = "$alert", fg = "#f38ba8", bold = true },
         { token = "branch", fg = "#7f849c" }, "git_status", { token = "$dirty", fg = "#fab387" }, { token = "$spin", fg = "#f9e2af" }]]

[ui.sidebar.agents]
row_gap = 0
rows = [
  [{ token = "$head", fg = "#cdd6f4", rules = [
      { starts_with = "×", fg = "#f38ba8", bold = true },
      { starts_with = "✓", fg = "#94e2d5" },
      { starts_with = "◐", fg = "#f9e2af" },
      { starts_with = "○", fg = "#a6e3a1" },
      { starts_with = "☾", fg = "#7f849c", dim = true },
      { starts_with = "·", fg = "#7f849c" } ] },
   ],
  [{ token = "$wait", fg = "#f38ba8", bold = true }],
  [{ token = "$done", fg = "#94e2d5" }],
  [{ token = "$task", fg = "#7f849c" }],
  [{ token = "$rule", fg = "#45475a" }],
]
# <<< covr.sidebar
