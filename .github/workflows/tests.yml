name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit · ${{ matrix.os }} · python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
        include:
          - os: ubuntu-22.04
            python: "3.8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests/unit -v

  e2e:
    # the plugin against a real, isolated herdr (release binaries), driven through tmux
    name: e2e · herdr ${{ matrix.herdr }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, herdr: "0.9.0", asset: herdr-linux-x86_64 }
          - { os: ubuntu-latest, herdr: "0.9.1", asset: herdr-linux-x86_64 }
          - { os: ubuntu-latest, herdr: "0.9.3", asset: herdr-linux-x86_64 }
          - { os: macos-latest, herdr: "0.9.3", asset: herdr-macos-aarch64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # the harness's own helpers; the plugin runs on the system python3
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install tmux; else sudo apt-get update -qq && sudo apt-get install -y -qq tmux; fi
      - name: Fetch herdr ${{ matrix.herdr }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${{ matrix.herdr }}" -R herdrdev/herdr -p "${{ matrix.asset }}" -D "$RUNNER_TEMP/herdr"
          chmod +x "$RUNNER_TEMP/herdr/${{ matrix.asset }}"
          "$RUNNER_TEMP/herdr/${{ matrix.asset }}" --version
          /usr/bin/python3 --version
      - name: Lifecycle suite
        env:
          HERDR_BIN: ${{ runner.temp }}/herdr/${{ matrix.asset }}
          E2E_ROOT: /tmp/ce
        run: tests/e2e/run.sh

  e2e-windows:
    # native Windows: named-pipe transport, msvcrt locking, the wake file, detached daemons (tests/e2e/windows.py)
    name: e2e · herdr ${{ matrix.herdr }} · windows-latest
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        herdr: ["0.9.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch herdr ${{ matrix.herdr }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${{ matrix.herdr }}" -R herdrdev/herdr -p herdr-windows-x86_64.zip -D "$env:RUNNER_TEMP"
          Expand-Archive "$env:RUNNER_TEMP\herdr-windows-x86_64.zip" "$env:RUNNER_TEMP\herdr"
          & "$env:RUNNER_TEMP\herdr\herdr.exe" --version
      - name: Lifecycle suite
        shell: pwsh
        run: |
          $env:HERDR_BIN = "$env:RUNNER_TEMP\herdr\herdr.exe"
          python tests/e2e/windows.py
